<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Eezy Magundwan Group</title>
<meta name="description" content="Life • Growth • Legacy — Eezy Magundwan Group" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B0B0B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Eezy Magundwan" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0B0B0B; font-family: 'Inter', sans-serif; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;
const GOLD = "#D4AF37";

/* ---------- minimal inline icon set ---------- */
const Icon = ({ path, size = 20, color = "currentColor", strokeWidth = 1.8, viewBox = "0 0 24 24" }) => (
  <svg width={size} height={size} viewBox={viewBox} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const HomeI = (p) => <Icon {...p} path={<><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></>} />;
const BuildingI = (p) => <Icon {...p} path={<><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1"/></>} />;
const PhoneI = (p) => <Icon {...p} path={<path d="M6.6 10.8a15.9 15.9 0 006.6 6.6l2.2-2.2a1.5 1.5 0 011.5-.4 11 11 0 003.4.5 1.5 1.5 0 011.5 1.5V20a1.5 1.5 0 01-1.5 1.5C10.6 21.5 2.5 13.4 2.5 3.5A1.5 1.5 0 014 2h3.2a1.5 1.5 0 011.5 1.5c0 1.2.2 2.3.5 3.4a1.5 1.5 0 01-.4 1.5z"/>} />;
const ChevronRightI = (p) => <Icon {...p} path={<path d="M9 18l6-6-6-6"/>} />;
const ChevronLeftI = (p) => <Icon {...p} path={<path d="M15 18l-6-6 6-6"/>} />;
const MapPinI = (p) => <Icon {...p} path={<><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.3"/></>} />;
const MailI = (p) => <Icon {...p} path={<><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></>} />;
const GlobeI = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></>} />;
const WheatI = (p) => <Icon {...p} path={<><path d="M12 22V9"/><path d="M12 3c1.5 1.5 1.5 3.5 0 5-1.5-1.5-1.5-3.5 0-5z"/><path d="M8 6c1.5 1.2 1.5 3 0 4.3C6.5 9 6.5 7.2 8 6z"/><path d="M16 6c-1.5 1.2-1.5 3 0 4.3 1.5-1.3 1.5-3.1 0-4.3z"/><path d="M7 11c1.7 1.2 1.7 3 0 4.2-1.7-1.2-1.7-3 0-4.2z"/><path d="M17 11c-1.7 1.2-1.7 3 0 4.2 1.7-1.2 1.7-3 0-4.2z"/></>} />;
const CpuI = (p) => <Icon {...p} path={<><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></>} />;
const LandmarkI = (p) => <Icon {...p} path={<><path d="M4 21h16"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M3 10l9-6 9 6"/></>} />;
const TruckI = (p) => <Icon {...p} path={<><rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></>} />;
const ZapI = (p) => <Icon {...p} path={<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>} />;
const WalletI = (p) => <Icon {...p} path={<><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></>} />;
const HeartHandshakeI = (p) => <Icon {...p} path={<><path d="M12 8l2-2a3 3 0 114 4l-6 6"/><path d="M12 8l-2-2a3 3 0 00-4 4l6 6"/></>} />;
const HardHatI = (p) => <Icon {...p} path={<><path d="M3 18h18"/><path d="M5 18a7 7 0 0114 0"/><path d="M12 6v5"/><rect x="9" y="4" width="6" height="3" rx="1"/></>} />;

const ventures = [
  { key: "engineering", name: "Engineering", icon: HardHatI, tag: "Infrastructure & Construction", desc: "Structural, civil and industrial engineering works built to last — from concept to commissioning." },
  { key: "farms", name: "Farms", icon: WheatI, tag: "Agriculture & Food Security", desc: "Sustainable farming operations producing crops and livestock for local and regional markets." },
  { key: "technology", name: "Technology", icon: CpuI, tag: "Digital Solutions", desc: "Software, systems and digital tools that modernise how African businesses operate." },
  { key: "properties", name: "Properties", icon: LandmarkI, tag: "Real Estate & Development", desc: "Residential, commercial and industrial property development across the region." },
  { key: "logistics", name: "Logistics", icon: TruckI, tag: "Transport & Supply Chain", desc: "Freight, haulage and supply chain solutions connecting producers to markets." },
  { key: "energy", name: "Energy", icon: ZapI, tag: "Power & Utilities", desc: "Renewable and conventional energy projects powering homes, farms and industry." },
  { key: "capital", name: "Capital", icon: WalletI, tag: "Investment & Finance", desc: "Capital deployment and financial partnerships that fund the Group's growth." },
  { key: "foundation", name: "Foundation", icon: HeartHandshakeI, tag: "Community & Legacy", desc: "Community development, education and welfare initiatives giving back to Zimbabwe." },
];

const contact = {
  address: "1059 Mubaira, Zimbabwe",
  phone: "+263 77 419 0505",
  email: "info@eezymagundwan.com",
  website: "www.eezymagundwan.com",
};

function Logo({ size = 40 }) {
  return (
    <div style={{ width: size, height: size, borderRadius: 10, background: `linear-gradient(135deg, ${GOLD}, #8a6d1f)`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Poppins, sans-serif", fontWeight: 800, color: "#0B0B0B", fontSize: size * 0.42, flexShrink: 0 }}>EM</div>
  );
}

function TopBar({ title, onBack }) {
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 20, background: "rgba(11,11,11,0.92)", backdropFilter: "blur(10px)", borderBottom: `1px solid rgba(212,175,55,0.2)`, padding: "16px 18px", display: "flex", alignItems: "center", gap: 12 }}>
      {onBack ? (
        <button onClick={onBack} style={{ background: "transparent", border: "none", color: GOLD, display: "flex", alignItems: "center", cursor: "pointer", padding: 4 }}>
          <ChevronLeftI size={22} color={GOLD} />
        </button>
      ) : <Logo size={34} />}
      <div>
        <div style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 16, color: "#fff", letterSpacing: 0.3 }}>{title}</div>
        {!onBack && <div style={{ fontFamily: "Poppins, sans-serif", fontSize: 9, letterSpacing: 2, color: GOLD, textTransform: "uppercase", marginTop: 2 }}>Life • Growth • Legacy</div>}
      </div>
    </div>
  );
}

function GoldButton({ children, onClick, variant = "solid", full }) {
  const solid = variant === "solid";
  return (
    <button onClick={onClick} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8, width: full ? "100%" : "auto", padding: "13px 22px", borderRadius: 8, fontFamily: "Poppins, sans-serif", fontWeight: 600, fontSize: 14, letterSpacing: 0.3, cursor: "pointer", border: `1px solid ${GOLD}`, background: solid ? GOLD : "transparent", color: solid ? "#0B0B0B" : GOLD }}>
      {children}
    </button>
  );
}

function HomeScreen({ go }) {
  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ padding: "44px 22px 36px", background: "radial-gradient(circle at 20% 10%, rgba(212,175,55,0.12), transparent 55%), #0B0B0B", borderBottom: `1px solid rgba(212,175,55,0.15)` }}>
        <div style={{ display: "flex", justifyContent: "center", marginBottom: 22 }}><Logo size={72} /></div>
        <p style={{ fontFamily: "Poppins, sans-serif", fontWeight: 600, fontSize: 11, letterSpacing: 2.5, color: GOLD, textTransform: "uppercase", textAlign: "center", marginBottom: 14 }}>Welcome to Eezy Magundwan Group</p>
        <h1 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 30, lineHeight: 1.2, textAlign: "center", color: "#fff", margin: 0 }}>
          Building <span style={{ color: GOLD }}>Excellence.</span><br />
          Creating <span style={{ color: GOLD }}>Value.</span><br />
          Leaving <span style={{ color: GOLD }}>a Legacy.</span>
        </h1>
        <p style={{ color: "#CFCFCF", fontSize: 14.5, lineHeight: 1.75, textAlign: "center", maxWidth: 340, margin: "18px auto 26px" }}>
          A diversified African business group engineering excellence and sustainable growth across eight ventures.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 280, margin: "0 auto" }}>
          <GoldButton full onClick={() => go("ventures")}>Explore Our Ventures <ChevronRightI size={16} color="#0B0B0B" /></GoldButton>
          <GoldButton full variant="outline" onClick={() => go("contact")}>Contact Us</GoldButton>
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "space-around", padding: "26px 18px", borderBottom: `1px solid rgba(212,175,55,0.12)` }}>
        {[["8","Ventures"],["1","Group Vision"],["ZW","Rooted"]].map(([n,l]) => (
          <div key={l} style={{ textAlign: "center" }}>
            <div style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 22, color: GOLD }}>{n}</div>
            <div style={{ fontSize: 11, color: "#9a9a9a", letterSpacing: 1, textTransform: "uppercase", marginTop: 2 }}>{l}</div>
          </div>
        ))}
      </div>

      <div style={{ padding: "30px 22px" }}>
        <h2 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 20, color: GOLD, marginBottom: 10 }}>Who We Are</h2>
        <p style={{ color: "#CFCFCF", fontSize: 14.5, lineHeight: 1.8 }}>
          Eezy Magundwan Group is a diversified brand committed to delivering excellence through Engineering, Farms, Technology, Properties, Logistics, Energy, Capital and Foundation initiatives — building a legacy for the communities we serve.
        </p>
      </div>

      <div style={{ padding: "0 22px 10px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
          <h2 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 20, color: "#fff", margin: 0 }}>Our Ventures</h2>
          <button onClick={() => go("ventures")} style={{ background: "none", border: "none", color: GOLD, fontSize: 12.5, fontFamily: "Poppins, sans-serif", fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>See all <ChevronRightI size={14} color={GOLD} /></button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {ventures.slice(0, 4).map((v) => <VentureTile key={v.key} venture={v} onClick={() => go("venture", v)} />)}
        </div>
      </div>
    </div>
  );
}

function VentureTile({ venture, onClick }) {
  const IconC = venture.icon;
  return (
    <button onClick={onClick} style={{ background: "#131313", border: `1px solid rgba(212,175,55,0.2)`, borderRadius: 12, padding: "16px 14px", textAlign: "left", cursor: "pointer", display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ width: 38, height: 38, borderRadius: 9, background: "rgba(212,175,55,0.12)", display: "flex", alignItems: "center", justifyContent: "center" }}><IconC size={19} color={GOLD} /></div>
      <div>
        <div style={{ fontFamily: "Poppins, sans-serif", fontWeight: 600, fontSize: 14, color: "#fff" }}>{venture.name}</div>
        <div style={{ fontSize: 11, color: "#9a9a9a", marginTop: 2 }}>{venture.tag}</div>
      </div>
    </button>
  );
}

function VenturesScreen({ go }) {
  return (
    <div style={{ padding: "18px 22px 100px" }}>
      <p style={{ color: "#9a9a9a", fontSize: 13.5, lineHeight: 1.7, marginBottom: 20 }}>Eight ventures, one vision — diversified excellence built for sustainable growth across Zimbabwe and the region.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {ventures.map((v) => {
          const IconC = v.icon;
          return (
            <button key={v.key} onClick={() => go("venture", v)} style={{ background: "#131313", border: `1px solid rgba(212,175,55,0.2)`, borderRadius: 12, padding: 16, display: "flex", alignItems: "center", gap: 14, textAlign: "left", cursor: "pointer" }}>
              <div style={{ width: 46, height: 46, borderRadius: 10, background: "rgba(212,175,55,0.12)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><IconC size={22} color={GOLD} /></div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "Poppins, sans-serif", fontWeight: 600, fontSize: 15, color: "#fff" }}>{v.name}</div>
                <div style={{ fontSize: 12, color: "#9a9a9a", marginTop: 2 }}>{v.tag}</div>
              </div>
              <ChevronRightI size={18} color={GOLD} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

function VentureDetailScreen({ venture, go }) {
  if (!venture) return null;
  const IconC = venture.icon;
  return (
    <div style={{ padding: "18px 22px 100px" }}>
      <div style={{ background: "linear-gradient(160deg, rgba(212,175,55,0.14), transparent)", border: `1px solid rgba(212,175,55,0.25)`, borderRadius: 16, padding: 26, textAlign: "center", marginBottom: 22 }}>
        <div style={{ width: 62, height: 62, borderRadius: 14, background: "rgba(212,175,55,0.15)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}><IconC size={30} color={GOLD} /></div>
        <h1 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 22, color: "#fff", margin: 0 }}>Eezy Magundwan {venture.name}</h1>
        <div style={{ fontSize: 12, color: GOLD, letterSpacing: 1.5, textTransform: "uppercase", marginTop: 6, fontFamily: "Poppins, sans-serif", fontWeight: 600 }}>{venture.tag}</div>
      </div>
      <h2 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 16, color: GOLD, marginBottom: 8 }}>About this venture</h2>
      <p style={{ color: "#CFCFCF", fontSize: 14.5, lineHeight: 1.8, marginBottom: 26 }}>{venture.desc}</p>
      <div style={{ background: "#131313", border: `1px dashed rgba(212,175,55,0.3)`, borderRadius: 12, padding: 18, textAlign: "center", marginBottom: 22 }}>
        <div style={{ fontSize: 13, color: "#9a9a9a" }}>Catalog for {venture.name} coming soon.</div>
      </div>
      <GoldButton full onClick={() => go("contact")}>Enquire About {venture.name}</GoldButton>
    </div>
  );
}

function ContactForm() {
  const [sent, setSent] = useState(false);
  const [form, setForm] = useState({ name: "", email: "", message: "" });
  const inputStyle = { width: "100%", background: "#131313", border: `1px solid rgba(212,175,55,0.25)`, borderRadius: 9, padding: "13px 14px", color: "#fff", fontSize: 14, fontFamily: "Inter, sans-serif", outline: "none", marginBottom: 12, boxSizing: "border-box" };

  if (sent) {
    return (
      <div style={{ background: "rgba(212,175,55,0.1)", border: `1px solid rgba(212,175,55,0.35)`, borderRadius: 12, padding: 20, textAlign: "center" }}>
        <div style={{ color: GOLD, fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 15, marginBottom: 6 }}>Message received</div>
        <div style={{ color: "#CFCFCF", fontSize: 13.5 }}>Thanks, {form.name.split(" ")[0] || "there"}. Our team will get back to you shortly.</div>
      </div>
    );
  }
  return (
    <div>
      <input style={inputStyle} placeholder="Your name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
      <input style={inputStyle} placeholder="Your email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
      <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} placeholder="How can we help?" value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })} />
      <GoldButton full onClick={() => form.name && setSent(true)}>Send Message</GoldButton>
    </div>
  );
}

function ContactScreen() {
  const rows = [
    { icon: MapPinI, label: "Address", value: contact.address },
    { icon: PhoneI, label: "Phone", value: contact.phone },
    { icon: MailI, label: "Email", value: contact.email },
    { icon: GlobeI, label: "Website", value: contact.website },
  ];
  return (
    <div style={{ padding: "18px 22px 100px" }}>
      <p style={{ color: "#9a9a9a", fontSize: 13.5, lineHeight: 1.7, marginBottom: 22 }}>Reach out to Eezy Magundwan Group — we'd love to hear from you.</p>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 26 }}>
        {rows.map((r) => {
          const IconC = r.icon;
          return (
            <div key={r.label} style={{ background: "#131313", border: `1px solid rgba(212,175,55,0.2)`, borderRadius: 12, padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 40, height: 40, borderRadius: 9, background: "rgba(212,175,55,0.12)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><IconC size={18} color={GOLD} /></div>
              <div>
                <div style={{ fontSize: 11, color: "#9a9a9a", textTransform: "uppercase", letterSpacing: 1 }}>{r.label}</div>
                <div style={{ fontFamily: "Poppins, sans-serif", fontWeight: 600, fontSize: 14, color: "#fff", marginTop: 2 }}>{r.value}</div>
              </div>
            </div>
          );
        })}
      </div>
      <h2 style={{ fontFamily: "Poppins, sans-serif", fontWeight: 700, fontSize: 16, color: GOLD, marginBottom: 10 }}>Send an enquiry</h2>
      <ContactForm />
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [activeVenture, setActiveVenture] = useState(null);
  const go = (s, v) => { if (s === "venture") setActiveVenture(v); setScreen(s); window.scrollTo(0, 0); };
  const titles = { home: "Eezy Magundwan Group", ventures: "Our Ventures", venture: activeVenture ? activeVenture.name : "Venture", contact: "Contact Us" };
  const showBack = screen === "venture";
  const navItems = [{ key: "home", label: "Home", icon: HomeI }, { key: "ventures", label: "Ventures", icon: BuildingI }, { key: "contact", label: "Contact", icon: PhoneI }];

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: "#0B0B0B", minHeight: "100vh", maxWidth: 430, margin: "0 auto", position: "relative", color: "#fff" }}>
      <TopBar title={titles[screen]} onBack={showBack ? () => go("ventures") : null} />
      {screen === "home" && <HomeScreen go={go} />}
      {screen === "ventures" && <VenturesScreen go={go} />}
      {screen === "venture" && <VentureDetailScreen venture={activeVenture} go={go} />}
      {screen === "contact" && <ContactScreen />}
      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, background: "rgba(11,11,11,0.95)", backdropFilter: "blur(10px)", borderTop: `1px solid rgba(212,175,55,0.2)`, display: "flex", justifyContent: "space-around", padding: "10px 0 14px" }}>
        {navItems.map((item) => {
          const IconC = item.icon;
          const active = screen === item.key || (item.key === "ventures" && screen === "venture");
          return (
            <button key={item.key} onClick={() => go(item.key)} style={{ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer", color: active ? GOLD : "#7a7a7a", padding: "4px 18px" }}>
              <IconC size={20} color={active ? GOLD : "#7a7a7a"} strokeWidth={active ? 2.3 : 1.8} />
              <span style={{ fontSize: 10, fontFamily: "Poppins, sans-serif", fontWeight: active ? 600 : 500 }}>{item.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
